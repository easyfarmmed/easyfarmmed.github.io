.wrap{max-width:560px;margin:0 auto;padding:14px 16px 28px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--teal);letter-spacing:.06em}

.bar{height:8px;background:#d7e6e1;border-radius:9px;margin:10px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}

p.lead{color:var(--mut);font-size:15px;line-height:1.4;margin:0 0 10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.stats div{background:#fff;border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mut)}.stats b{display:block;font-size:22px;color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;font:800 17px Nunito,system-ui,sans-serif;cursor:pointer;margin:0 0 10px;background:var(--teal);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}.btn:disabled{opacity:.4}
.q{background:#fff;border-radius:18px;padding:16px;font-size:17px;line-height:1.4;margin:12px 0}
.q small{display:block;color:var(--coral);font-size:12px;margin-bottom:6px;letter-spacing:.04em}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 9px;font:700 16px Nunito,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.opt i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:14px}
.opt.ok{border-color:var(--teal);background:#e3f4ee}.opt.bad{border-color:var(--red);background:#fdecec}.opt.bad i{background:var(--red)}.opt.dim{opacity:.45}
.ex{border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;margin:4px 0 12px;display:flex;gap:10px;align-items:center}
.ex svg{width:62px;height:62px;flex:none}.ex.ok{background:#e3f4ee}.ex.bad{background:#fdecec}.ex b{display:block}
.list{margin:0 0 12px;padding:0;list-style:none}.list li{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:7px;font-size:14px;line-height:1.35}.list li b{color:var(--teal)}
.foot{margin-top:auto;padding-top:14px;font-size:11px;color:var(--mut);text-align:center}
@media (prefers-color-scheme:dark){:root{--bg:#14201d;--ink:#eef5f3;--mut:#9fb3ad;--card:#1e2c28;--line:#2f433d}
